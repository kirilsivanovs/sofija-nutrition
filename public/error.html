<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviss īslaicīgi nepieejams | Sofija Ivanova</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8faf9 0%, #e8f0ed 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #1a1a1a;
        }
        
        .container {
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
        }
        
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #2d5a4a 0%, #3d7a64 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(45, 90, 74, 0.2);
        }
        
        .icon svg {
            width: 60px;
            height: 60px;
            stroke: white;
            stroke-width: 1.5;
            fill: none;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #2d5a4a;
            margin-bottom: 1rem;
            font-family: 'Lora', Georgia, serif;
        }
        
        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }
        
        .email-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #2d5a4a 0%, #3d7a64 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(45, 90, 74, 0.3);
        }
        
        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(45, 90, 74, 0.4);
        }
        
        .email-link svg {
            width: 20px;
            height: 20px;
        }
        
        .retry-btn {
            display: inline-block;
            margin-top: 1rem;
            color: #2d5a4a;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid #2d5a4a;
            border-radius: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: transparent;
        }
        
        .retry-btn:hover {
            background: #2d5a4a;
            color: white;
        }
        
        .footer {
            margin-top: 3rem;
            color: #999;
            font-size: 0.85rem;
        }
        
        .footer a {
            color: #2d5a4a;
            text-decoration: none;
        }
        
        /* Pulse animation for icon */
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Language switcher */
        .lang-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        .lang-btn {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .lang-btn:hover, .lang-btn.active {
            background: #2d5a4a;
            color: white;
            border-color: #2d5a4a;
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('lv')">LV</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" onclick="setLang('ru')">RU</button>
    </div>
    
    <div class="container">
        <div class="icon pulse">
            <svg viewBox="0 0 24 24">
                <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <h1 id="title">Serviss īslaicīgi nepieejams</h1>
        
        <p id="message">
            Atvainojamies par sagādātajām neērtībām. Mūsu sistēma pašlaik tiek atjaunināta. 
            Lūdzu, mēģiniet vēlāk vai sazinieties ar mums pa e-pastu.
        </p>
        
        <a href="mailto:info@sofija-nutrition.lv" class="email-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span id="email-text">Rakstīt e-pastu</span>
        </a>
        
        <br>
        
        <button class="retry-btn" onclick="location.reload()">
            <span id="retry-text">↻ Mēģināt vēlreiz</span>
        </button>
        
        <div class="footer">
            <p><a href="https://www.sofija-nutrition.lv">www.sofija-nutrition.lv</a></p>
            <p id="footer-text" style="margin-top: 0.5rem;">Sofija Ivanova · Uztura speciāliste</p>
        </div>
    </div>
    
    <script>
        const translations = {
            lv: {
                title: 'Serviss īslaicīgi nepieejams',
                message: 'Atvainojamies par sagādātajām neērtībām. Mūsu sistēma pašlaik tiek atjaunināta. Lūdzu, mēģiniet vēlāk vai sazinieties ar mums pa e-pastu.',
                emailText: 'Rakstīt e-pastu',
                retryText: '↻ Mēģināt vēlreiz',
                footerText: 'Sofija Ivanova · Uztura speciāliste'
            },
            en: {
                title: 'Service Temporarily Unavailable',
                message: 'We apologize for the inconvenience. Our system is currently being updated. Please try again later or contact us via email.',
                emailText: 'Send Email',
                retryText: '↻ Try Again',
                footerText: 'Sofija Ivanova · Nutrition Specialist'
            },
            ru: {
                title: 'Сервис временно недоступен',
                message: 'Приносим извинения за неудобства. Наша система обновляется. Пожалуйста, попробуйте позже или свяжитесь с нами по электронной почте.',
                emailText: 'Написать письмо',
                retryText: '↻ Попробовать снова',
                footerText: 'Софья Иванова · Специалист по питанию'
            }
        };
        
        function setLang(lang) {
            const t = translations[lang] || translations.lv;
            
            document.getElementById('title').textContent = t.title;
            document.getElementById('message').textContent = t.message;
            document.getElementById('email-text').textContent = t.emailText;
            document.getElementById('retry-text').textContent = t.retryText;
            document.getElementById('footer-text').textContent = t.footerText;
            document.documentElement.lang = lang;
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
            });
            
            // Save preference
            localStorage.setItem('preferredLang', lang);
        }
        
        // Load saved language
        const savedLang = localStorage.getItem('preferredLang') || 'lv';
        setLang(savedLang);
    </script>
</body>
</html>
