<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serviss īslaicīgi nepieejams | Sofija Ivanova</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #1a1a1a;
      }

      .container {
        max-width: 500px;
        text-align: center;
      }

      .identity {
        margin-bottom: 2rem;
      }

      .identity .name {
        display: block;
        font-size: 1.15rem;
        font-weight: 600;
        color: #1e2530;
      }

      .identity .specialty {
        display: block;
        font-size: 0.9rem;
        color: #52607a;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        color: #1e2530;
        margin-bottom: 1rem;
      }

      p {
        color: #666;
        line-height: 1.7;
        margin-bottom: 1.5rem;
        font-size: 1rem;
      }

      .email-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #1e2530;
        color: white;
        padding: 1rem 2rem;
        border-radius: 4px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s ease;
      }

      .email-link:hover {
        background: #2e7d5b;
      }

      .email-link svg {
        width: 20px;
        height: 20px;
      }

      .retry-btn {
        display: inline-block;
        margin-top: 1rem;
        color: #1e2530;
        text-decoration: none;
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
        border: 1px solid #1e2530;
        border-radius: 4px;
        transition: all 0.2s ease;
        cursor: pointer;
        background: transparent;
      }

      .retry-btn:hover {
        background: #1e2530;
        color: white;
      }

      .footer {
        margin-top: 3rem;
        color: #52607a;
        font-size: 0.85rem;
      }

      .footer a {
        color: #1e2530;
        text-decoration: none;
      }

      /* Language switcher */
      .lang-switcher {
        position: absolute;
        top: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.5rem;
      }

      .lang-btn {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        background: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
      }

      .lang-btn:hover,
      .lang-btn.active {
        background: #1e2530;
        color: white;
        border-color: #1e2530;
      }
    </style>
  </head>
  <body>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('lv')">LV</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>

    <div class="container">
      <div class="identity">
        <span class="name">Sofija Ivanova</span>
        <span class="specialty" id="specialty-text">Uztura speciāliste</span>
      </div>

      <h1 id="title">Serviss īslaicīgi nepieejams</h1>

      <p id="message">
        Atvainojamies par sagādātajām neērtībām. Mūsu sistēma pašlaik tiek atjaunināta. Lūdzu,
        mēģiniet vēlāk vai sazinieties ar mums pa e-pastu.
      </p>

      <a href="mailto:info@sofijaivanova.lv" class="email-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>
        <span id="email-text">Rakstīt e-pastu</span>
      </a>

      <br />

      <button class="retry-btn" onclick="location.reload()">
        <span id="retry-text">↻ Mēģināt vēlreiz</span>
      </button>

      <div class="footer">
        <p><a href="https://www.sofijaivanova.lv">www.sofijaivanova.lv</a></p>
        <p id="footer-text" style="margin-top: 0.5rem">Sofija Ivanova · Uztura speciāliste</p>
      </div>
    </div>

    <script>
      const translations = {
        lv: {
          title: 'Serviss īslaicīgi nepieejams',
          message:
            'Atvainojamies par sagādātajām neērtībām. Mūsu sistēma pašlaik tiek atjaunināta. Lūdzu, mēģiniet vēlāk vai sazinieties ar mums pa e-pastu.',
          emailText: 'Rakstīt e-pastu',
          retryText: '↻ Mēģināt vēlreiz',
          specialtyText: 'Uztura speciāliste',
          footerText: 'Sofija Ivanova · Uztura speciāliste',
        },
        en: {
          title: 'Service Temporarily Unavailable',
          message:
            'We apologize for the inconvenience. Our system is currently being updated. Please try again later or contact us via email.',
          emailText: 'Send Email',
          retryText: '↻ Try Again',
          // pending Sofija, same status as header_specialty in main.js
          specialtyText: 'Nutrition Specialist',
          footerText: 'Sofija Ivanova · Nutrition Specialist',
        },
        ru: {
          title: 'Сервис временно недоступен',
          message:
            'Приносим извинения за неудобства. Наша система обновляется. Пожалуйста, попробуйте позже или свяжитесь с нами по электронной почте.',
          emailText: 'Написать письмо',
          retryText: '↻ Попробовать снова',
          // pending Sofija, same status as header_specialty in main.js
          specialtyText: 'Специалист по питанию',
          footerText: 'Софья Иванова · Специалист по питанию',
        },
      };

      function setLang(lang) {
        const t = translations[lang] || translations.lv;

        document.getElementById('title').textContent = t.title;
        document.getElementById('message').textContent = t.message;
        document.getElementById('email-text').textContent = t.emailText;
        document.getElementById('retry-text').textContent = t.retryText;
        document.getElementById('specialty-text').textContent = t.specialtyText;
        document.getElementById('footer-text').textContent = t.footerText;
        document.documentElement.lang = lang;

        // Update active button
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
        });

        // Save preference
        localStorage.setItem('preferredLang', lang);
      }

      // Load saved language
      const savedLang = localStorage.getItem('preferredLang') || 'lv';
      setLang(savedLang);
    </script>
  </body>
</html>
