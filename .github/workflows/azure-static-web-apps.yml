name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Scheduled cleanup - каждый день в 3:00 UTC
  schedule:
    - cron: '0 3 * * *'
  # Manual trigger for cleanup
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: 'Only run cleanup (skip deploy)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============================================
  # CLEANUP: Удаление orphaned staging environments
  # ============================================
  cleanup_stale_environments:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup_only == 'true') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: 🧹 Cleanup Stale Environments
    steps:
      - uses: actions/checkout@v4
      
      - name: Get open PR numbers
        id: get_prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const prNumbers = prs.map(pr => pr.number);
            console.log('Open PRs:', prNumbers);
            core.setOutput('pr_numbers', JSON.stringify(prNumbers));
            core.setOutput('count', prNumbers.length);
            return prNumbers;

      - name: Check environment limit
        id: check_limit
        run: |
          OPEN_PRS=${{ steps.get_prs.outputs.count }}
          # Azure Static Web Apps Free tier: 3 staging environments max
          # If we have 3+ open PRs, we need to close oldest ones
          if [ "$OPEN_PRS" -ge 3 ]; then
            echo "⚠️ Warning: $OPEN_PRS open PRs - approaching staging limit (3)"
            echo "needs_cleanup=true" >> $GITHUB_OUTPUT
          else
            echo "✅ $OPEN_PRS open PRs - within limits"
            echo "needs_cleanup=false" >> $GITHUB_OUTPUT
          fi

      - name: Close stale environments via SWA action
        if: steps.check_limit.outputs.needs_cleanup == 'true' || github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Get closed PRs from last 7 days that might have orphaned environments
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            const { data: closedPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 20
            });
            
            console.log(`Found ${closedPRs.length} recently closed PRs`);
            
            // For each closed PR, trigger the close action by re-running the workflow
            // This is a workaround since we can't directly call Azure API without credentials
            for (const pr of closedPRs.slice(0, 5)) {
              console.log(`PR #${pr.number}: ${pr.title} (closed at ${pr.closed_at})`);
            }
            
            console.log('Note: Orphaned environments will be cleaned on next PR close event');
            console.log('To manually clean, close and reopen a PR or use Azure Portal');

  # ============================================
  # ЭТАП 1: Unit тесты API (быстрые, без деплоя)
  # ============================================
  test_api:
    if: (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) && github.event.inputs.cleanup_only != 'true'
    runs-on: ubuntu-latest
    name: 🧪 API Unit Tests
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./api/coverage/
          retention-days: 7

  # ============================================
  # ЭТАП 2: Deploy to Staging (Preview для PR)
  # ============================================
  build_and_deploy:
    needs: [test_api, cleanup_stale_environments]
    if: always() && (needs.test_api.result == 'success' || needs.test_api.result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) && github.event.inputs.cleanup_only != 'true'
    runs-on: ubuntu-latest
    name: Build and Deploy
    outputs:
      static_web_app_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
      
      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.builddeploy.outputs.static_web_app_url }}';
            const body = `## 🚀 Preview Deployment Ready!
            
            | Environment | URL |
            |------------|-----|
            | 🔗 Preview | ${url} |
            
            <details>
            <summary>📋 Test Checklist</summary>
            
            - [ ] Booking flow works correctly
            - [ ] Admin panel accessible
            - [ ] Mobile responsive
            - [ ] Translations display properly
            
            </details>
            
            ---
            *This preview will be automatically deleted when the PR is closed.*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Preview Deployment Ready')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # ============================================
  # ЭТАП 3: E2E тесты на задеплоенной среде
  # ============================================
  test_e2e:
    needs: [build_and_deploy]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: 🎭 E2E Tests (Playwright)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ needs.build_and_deploy.outputs.static_web_app_url || 'https://wonderful-bay-0fb550403.4.azurestaticapps.net' }}
          E2E_TEST_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ============================================
  # ЭТАП 4: Auto-merge PR после успешных тестов
  # ============================================
  auto_merge:
    needs: [test_api, build_and_deploy, test_e2e]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: 🔀 Auto-merge PR
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Cleanup staging при закрытии PR
  # ============================================
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: 🧹 Close PR Environment
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
