# ============================================
# Deploy Static Web App Preview (Frontend + Managed API)
# Triggers on pull requests to main
# ============================================
name: Deploy Frontend Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'shared/**'
      - 'api/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: deploy-frontend-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview to Azure Static Web Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.action != 'closed' && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare API shared files
        run: cp shared/translations.js api/shared-translations.js

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # ── Build config ──
          app_location: /
          output_location: dist
          app_build_command: npm run build
          # Managed API — deploys Functions alongside frontend (free tier)
          api_location: api
          api_build_command: npm run build
        env:
          NODE_VERSION: 20

  e2e:
    name: E2E (Preview)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ github.event.action != 'closed' && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Resolve preview URL
        id: preview_url
        uses: actions/github-script@v7
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const urlRegex = /https:\/\/[\w.-]+\.azurestaticapps\.net\/?/gi;

            // Cache comments to avoid repeated API calls
            let cachedComments = null;

            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try {
                // Check deployments first (most reliable)
                const deployments = await github.rest.repos.listDeployments({
                  owner,
                  repo,
                  ref: sha,
                  per_page: 10,
                });

                for (const deployment of deployments.data) {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 5,
                  });

                  const success = statuses.data.find(
                    (status) => status.state === 'success' && status.environment_url
                  );

                  if (success?.environment_url) {
                    core.setOutput('url', success.environment_url);
                    return;
                  }
                }

                // Only fetch comments once on first attempt or every 3rd attempt
                if (prNumber && (!cachedComments || attempt % 3 === 0)) {
                  try {
                    const comments = await github.rest.issues.listComments({
                      owner,
                      repo,
                      issue_number: prNumber,
                      per_page: 30,
                    });
                    cachedComments = comments.data;
                  } catch (error) {
                    // If rate limited, use cached comments or skip
                    if (error.status === 429) {
                      core.warning(`GitHub API rate limited on attempt ${attempt}, using cached data or skipping comments`);
                    } else {
                      throw error;
                    }
                  }
                }

                // Check cached comments
                if (cachedComments) {
                  for (const comment of cachedComments.slice().reverse()) {
                    const matches = comment.body?.match(urlRegex);
                    if (matches && matches.length) {
                      core.setOutput('url', matches[matches.length - 1]);
                      return;
                    }
                  }
                }

                // Exponential backoff: 10s, 15s, 20s, 25s...
                const backoffTime = 10000 + (attempt * 5000);
                core.info(`Attempt ${attempt}/8 failed, waiting ${backoffTime/1000}s before retry...`);
                await delay(backoffTime);
              } catch (error) {
                if (error.status === 429) {
                  core.warning(`Rate limited on attempt ${attempt}, waiting 30s...`);
                  await delay(30000);
                } else {
                  throw error;
                }
              }
            }

            core.setFailed('No successful deployment URL found after retries.');

      - name: Run e2e tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview_url.outputs.url }}
        run: npm run test:e2e

  close:
    name: Close Preview Environment
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'closed' && github.event_name == 'pull_request' }}
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
