# ============================================
# Deploy (Frontend + Managed API)
# Triggers on CI success on main; deploys the SWA frontend
# and its managed API together against the same tested commit.
# ============================================
name: Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Node 22 — Astro 6 requires >=22.12; SWA/Oryx only ships Node 20)
        run: npm run build

      - name: Prepare API shared files
        run: cp shared/translations.js api/shared-translations.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # ── Build config ──
          # Frontend is pre-built above on Node 22; deploy the ready dist/ as-is.
          app_location: dist
          output_location: ''
          skip_app_build: true
          # Managed API — builds inside this deploy action.
          api_location: api
          api_build_command: npm run build
