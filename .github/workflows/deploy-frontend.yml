# ============================================
# Deploy Static Web App (Frontend)
# Triggers on push to main when frontend files change
# ============================================
name: Deploy Frontend

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare API shared files
        run: cp shared/translations.js api/shared-translations.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # ── Build config ──
          app_location: /
          output_location: dist
          app_build_command: npm run build
          # Managed API — deploys Functions alongside frontend (free tier)
          api_location: api
          api_build_command: npm run build
        env:
          NODE_VERSION: 20
